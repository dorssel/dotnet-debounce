---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read
      checks: write
      pull-requests: write
      actions: write
      id-token: write
      attestations: write

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          cache: true
          cache-dependency-path: |
            global.json
            '**/Directory.Packages.props'
            .config/dotnet-tools.json

      - name: Restore dependencies
        run: |
          dotnet tool restore
          dotnet restore
          dotnet restore Documentation --no-dependencies

      - name: Warm up GitVersion serially
        # Workaround for https://github.com/GitTools/GitVersion/issues/5367
        run: |
          dotnet msbuild Debounce/Debounce.csproj \
            -target:GetVersion \
            -property:TargetFramework=net8.0 \
            -property:Configuration=Release

      - name: Build
        run: |
          dotnet build --configuration Release --no-restore --binaryLogger:build.binlog

      - name: Test
        run: |
          dotnet test --configuration Release --no-build \
            --report-spekt-junit \
            --coverage --coverage-output-format cobertura

      - name: Package
        run: dotnet pack --configuration Release --no-build Debounce

      - name: Upload Package Artifact
        id: upload-nupkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: Debounce/bin/Release/Dorssel.Utilities.Debounce.${{ env.GitVersion_MajorMinorPatch }}.nupkg
          retention-days: 14

      - name: Upload Symbol Package Artifact
        id: upload-snupkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: Debounce/bin/Release/Dorssel.Utilities.Debounce.${{ env.GitVersion_MajorMinorPatch }}.snupkg
          retention-days: 14

      - name: Build Package Attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: Dorssel.Utilities.Debounce.${{ env.GitVersion_MajorMinorPatch }}.nupkg
          subject-digest: sha256:${{ steps.upload-nupkg.outputs.artifact-digest }}

      - name: Build Symbol Package Attestation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: Dorssel.Utilities.Debounce.${{ env.GitVersion_MajorMinorPatch }}.snupkg
          subject-digest: sha256:${{ steps.upload-snupkg.outputs.artifact-digest }}

      - name: Build Documentation
        run: |
          dotnet build --configuration Release --no-restore Documentation --binaryLogger:documentation.binlog

      - name: Upload GitHub Pages as artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Documentation/_site/

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          report_type: test_results
          files: 'TestResults/TestResults.xml'
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: 'TestResults/*.cobertura.xml'
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Submit Dependencies to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          detectorArgs: MSBuildBinaryLog=Enable
          detectorsFilter: MSBuildBinaryLog

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: always

  deploy:
    name: Deploy
    needs: build
    if: ${{ always() && github.event_name == 'push' && needs.build.result == 'success' }}

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
