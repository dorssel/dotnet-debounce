---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '39 20 * * 4'

permissions: {}

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          cache: true
          cache-dependency-path: |
            global.json
            '**/Directory.Packages.props'
            .config/dotnet-tools.json

      - name: Install dependencies
        run: |
          dotnet tool restore
          dotnet restore
          dotnet restore Documentation --no-dependencies

      - name: Warm up GitVersion serially
        # Workaround for https://github.com/GitTools/GitVersion/issues/5367
        run: |
          dotnet msbuild Debounce/Debounce.csproj \
            -target:GetVersion \
            -property:TargetFramework=net8.0 \
            -property:Configuration=Release

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
